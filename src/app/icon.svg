<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Headband Gradients -->
    <linearGradient id="headbandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00cbd0" />
      <stop offset="50%" stop-color="#00a8e8" />
      <stop offset="70%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Left Earcup Gradients (Purple theme) -->
    <linearGradient id="leftCupOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>
    <linearGradient id="leftCupInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12003c" />
      <stop offset="100%" stop-color="#240046" />
    </linearGradient>

    <!-- Right Earcup Gradients (Teal theme) -->
    <linearGradient id="rightCupOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="rightCupInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845" />
      <stop offset="100%" stop-color="#003049" />
    </linearGradient>

    <!-- Glow Filter for Microphone -->
    <filter id="micGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rotate the entire headphones 20 degrees clockwise to match the original image angle -->
  <g transform="rotate(20, 250, 235)">
    <!-- 1. HEADBAND -->
    <!-- Outer thick arc -->
    <path d="M 140 240 A 110 110 0 0 1 360 240" fill="none" stroke="url(#headbandGrad)" stroke-width="32" stroke-linecap="round" />
    <!-- Inner cyan highlight arc -->
    <path d="M 148 238 A 102 102 0 0 1 352 238" fill="none" stroke="#00ffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    
    <!-- Connection Bands -->
    <rect x="124" y="215" width="16" height="35" rx="4" fill="#7000ff" transform="rotate(-10, 132, 230)" />
    <rect x="360" y="215" width="16" height="35" rx="4" fill="#00cbd0" transform="rotate(10, 368, 230)" />

    <!-- 2. LEFT EARCUP (Purple/Violet - Tilted slightly inward) -->
    <g transform="rotate(-10, 135, 260)">
      <!-- Outer Body -->
      <ellipse cx="135" cy="260" rx="38" ry="56" fill="url(#leftCupOuter)" />
      <!-- Inner Cushion -->
      <ellipse cx="140" cy="260" rx="28" ry="46" fill="url(#leftCupInner)" />
      <!-- Inner Hole -->
      <ellipse cx="143" cy="260" rx="16" ry="32" fill="#03001e" />
      <!-- Highlight Rim -->
      <path d="M 108 260 A 27 48 0 0 1 158 220" fill="none" stroke="#b388ff" stroke-width="3.5" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- 3. RIGHT EARCUP (Teal/Cyan - Tilted slightly inward) -->
    <g transform="rotate(10, 365, 260)">
      <!-- Outer Body -->
      <ellipse cx="365" cy="260" rx="38" ry="56" fill="url(#rightCupOuter)" />
      <!-- Inner Cushion -->
      <ellipse cx="360" cy="260" rx="28" ry="46" fill="url(#rightCupInner)" />
      <!-- Inner Hole -->
      <ellipse cx="357" cy="260" rx="16" ry="32" fill="#001020" />
      <!-- Highlight Rim -->
      <path d="M 338 220 A 27 48 0 0 1 388 260" fill="none" stroke="#90e0ef" stroke-width="3.5" opacity="0.8" stroke-linecap="round" />
    </g>

    <!-- 4. MICROPHONE ARM (Curves from the right earcup forward and left) -->
    <!-- Cyan glow background -->
    <path d="M 360 280 Q 320 375 240 345" fill="none" stroke="#00f5d4" stroke-width="16" stroke-linecap="round" opacity="0.8" />
    <!-- White center line -->
    <path d="M 360 280 Q 320 375 240 345" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" filter="url(#micGlow)" />
    
    <!-- Microphone Tip (White with Cyan Glow) -->
    <circle cx="236" cy="343" r="14" fill="#00f5d4" opacity="0.8" />
    <circle cx="236" cy="343" r="8" fill="#ffffff" />
  </g>
</svg>
